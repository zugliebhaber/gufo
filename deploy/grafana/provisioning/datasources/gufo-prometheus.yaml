apiVersion: 1

datasources:
  - name: Gufo Prometheus
    uid: gufo-prometheus
    type: prometheus
    access: proxy
    # Change this to the Prometheus address reachable from Grafana.
    url: http://127.0.0.1:9090
    isDefault: false
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
